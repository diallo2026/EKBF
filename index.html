<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1d6b3a"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Ets. KBF – Gestion de stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f4;--c:#fff;--t:#17231b;--m:#5d6b61;--p:#1d6b3a;--b:#d9e0da;--w:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a15;--c:#1b261f;--t:#e8f0ea;--m:#9fb0a4;--p:#4cc27a;--b:#2e3d33}}
:root[data-theme=dark]{--bg:#121a15;--c:#1b261f;--t:#e8f0ea;--m:#9fb0a4;--p:#4cc27a;--b:#2e3d33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--p);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{height:36px;background:#fff;border-radius:6px}header b{flex:1}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px}nav a{padding:8px 12px;background:var(--c);border:1px solid var(--b);border-radius:8px;cursor:pointer}nav a.on{background:var(--p);color:#fff}
main{padding:12px;max-width:1100px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.g b{font-size:24px;display:block}
label{display:block;margin:8px 0;font-size:13px;color:var(--m)}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%}
input[type=checkbox]{width:auto}
button{background:var(--p);color:#fff;border:0;cursor:pointer;width:auto;margin:4px 4px 4px 0}button.s{background:var(--m);padding:6px 10px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--b);padding:5px 7px;text-align:left}td input{min-width:60px;padding:5px}
.ok{color:var(--p)}.lo{color:#d98a00}.ko,.ng{color:var(--w)}.pr{display:none;text-align:center}
@media print{header,nav,.no{display:none!important}body{background:#fff;color:#000}.pr{display:block}.card{border:0}@page{size:A4;margin:12mm}}
</style></head><body><div id="app"></div>

op:()=>{if(!arg)return `<h2>Opération rapide</h2><p>Choisissez le type d'opération :</p><div class=g>${can('in')?`<button style="padding:36px;font-size:20px" onclick="go('op',{t:'IN'})">⬇ ENTRÉE</button>`:''}${can('out')?`<button style="padding:36px;font-size:20px;background:var(--w)" onclick="go('op',{t:'OUT'})">⬆ SORTIE</button>`:''}</div>`;
 const t=arg.t,O=t=='OUT';if(!can(O?'out':'in')){arg=null;return V.op()}
 return `<h2 style="color:${O?'var(--w)':'var(--p)'}">${O?'⬆ SORTIE':'⬇ ENTRÉE'}</h2><small>Type verrouillé pour cette opération. Pour en changer, annulez.</small><div class=card><label>Stock<select id=s>${opt(myStocks(),lastS)}</select></label><label>Produit<input id=p list=pl placeholder="Rechercher un produit…" autocomplete=off></label><datalist id=pl>${S.products.filter(p=>p.active).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist><label>Quantité<input id=q type=number step=any min=0 inputmode=decimal style="font-size:22px"></label><details><summary>Plus d'options</summary><label>Date<input id=d type=date value="${today()}"></label><label>${O?'Motif':'Fournisseur'}<input id=x></label><label>${O?'Destination / client':'N° facture / bon'}<input id=y></label><label>Observation<input id=o></label>${O&&F()?'<label><input type=checkbox id=f> Autoriser un stock insuffisant (anomalie)</label>':''}</details><button style="padding:16px 28px" onclick="sub('${t}')">Enregistrer</button><button class=s onclick="go('op')">Annuler</button></div>`},
in:()=>mf('IN'),out:()=>mf('OUT'),inv:()=>invf('inv'),init:()=>invf('init'),
mov:()=>{const a=arg||{};let r=vm().filter(m=>(!a.f||m.date>=a.f)&&(!a.t||m.date<=a.t)&&(!a.s||m.s==a.s)&&(!a.y||m.t==a.y)&&(!a.u||m.u==a.u)&&(!a.p||pn(m.p).toLowerCase().includes(a.p.toLowerCase()))).reverse();
 return `<h2>Mouvements de stock</h2><div class=card><div class=g><label>Du<input id=f type=date value="${a.f||''}"></label><label>Au<input id=t type=date value="${a.t||''}"></label><label>Stock<select id=s><option value="">Tous</option>${opt(myStocks(),a.s)}</select></label><label>Type<select id=y><option value="">Tous</option>${Object.entries(TY).map(([k,v])=>`<option value=${k} ${a.y==k?'selected':''}>${v}</option>`).join('')}</select></label><label>Produit<input id=p value="${esc(a.p||'')}"></label>${F()?`<label>Gestionnaire<select id=u><option value="">Tous</option>${S.users.map(u=>`<option value=${u.id} ${a.u==u.id?'selected':''}>${esc(un(u.id))}</option>`).join('')}</select></label>`:''}</div><button onclick="go('mov',{f:$('#f').value,t:$('#t').value,s:$('#s').value,y:$('#y').value,p:$('#p').value,u:$('#u')?.value})">Filtrer</button></div>`+movTable(r.slice(0,500))+(r.length>500?'<p>500 premiers résultats affichés — affinez les filtres.</p>':'')},
alr:()=>`<h2>Alertes stock</h2>`+tb(['Produit','Code','Stock','Min','Statut'],alerts().map(x=>td(esc(x.p.name),x.p.code,x.q,x.p.min,`<span class="${x.st=='low'?'lo':'ko'}">${ST[x.st]}</span>`))),
rep:()=>{const a=arg||{s:myStocks()[0]?.id,d:today(),z:1},ss=a.s=='*'?myStocks():myStocks().filter(s=>s.id==a.s),R={};
 vm().filter(m=>ss.some(s=>s.id==m.s)).forEach(m=>{const r=R[m.p]??={i:0,e:0,o:0,j:0};if(m.date<a.d||(m.t=='INIT'&&m.date<=a.d))r.i+=m.d;else if(m.date==a.d){if(m.t=='IN')r.e+=m.d;else if(m.t=='OUT')r.o-=m.d;else r.j+=m.d}});
 const rows=S.products.filter(p=>p.active).map(p=>({p,...(R[p.id]||{i:0,e:0,o:0,j:0})})).filter(r=>!a.z||r.i||r.e||r.o||r.j),T=k=>rows.reduce((x,r)=>x+r[k],0);
 return `<div class=no><h2>Rapports</h2><div class=card><label>Stock<select id=s>${F()&&myStocks().length>1?`<option value="*" ${a.s=='*'?'selected':''}>Tous les stocks</option>`:''}${opt(myStocks(),a.s)}</select></label><label>Date<input id=d type=date value="${a.d}"></label><label><input type=checkbox id=z ${a.z?'checked':''}> Masquer les produits sans stock ni mouvement</label><button onclick="go('rep',{s:$('#s').value,d:$('#d').value,z:$('#z').checked})">Afficher</button><button onclick="print()">Imprimer / PDF</button></div></div>`+
 `<div class="card" style="text-align:center">${logo()}<h3>${CO}</h3><small>${SUB}</small><h2>ÉTAT JOURNALIER DU STOCK</h2><b>${a.s=='*'?'Situation globale':'Situation du stock – '+esc(sn(a.s))}</b> · ${fd(a.d)}<br><small>Édité le ${fd(today())} à ${now()} par ${esc(un(me().id))}</small></div>`+
 tb(['N°','Produit','Stock initial','Entrées','Sorties','Stock final','Écart'],rows.map(r=>td(r.p.id,esc(r.p.name),r.i,r.e,r.o,r.i+r.e-r.o+r.j,r.j)))+`<div class=card>Total produits : <b>${rows.length}</b> · Total entrées : <b>${T('e')}</b> · Total sorties : <b>${T('o')}</b><br>Observations : ________________________________<br><br><br>Gestionnaire : ____________________ &nbsp;&nbsp; Responsable / Fondateur : ____________________</div>`},
hist:()=>`<h2>Historique</h2>`+tb(['Date','Utilisateur','Action'],S.audit.slice(-300).reverse().map(a=>td(new Date(a.t).toLocaleString('fr-FR'),esc(a.un||un(a.u)),esc(a.a)))),
acc:()=>`<h2>Mon compte</h2><div class=card>${esc(un(me().id))} · ${esc(me().login)}<br><br><button onclick="myPw()">Changer mon mot de passe</button></div>`};
function addS(){if(!F())return;const n=$('#sn').value.trim();if(!n||S.stocks.some(s=>s.name.toLowerCase()==n.toLowerCase()))return alert('Nom vide ou déjà utilisé');const id='s'+Date.now().toString(36);W(setDoc(doc(db,'stocks',id),{id,name:n,desc:$('#sd').value,resp:$('#sr').value,active:1,created:today()}));log('Stock créé : '+n);draw()}
async function myPw(){const w=prompt('Nouveau mot de passe (6+) :');if(!w||w.length<6)return;try{await updatePassword(auth.currentUser,w);log('Mot de passe modifié');alert('Modifié')}catch(e){alert(e.code=='auth/requires-recent-login'?'Reconnectez-vous puis réessayez.':e.message)}}
boot0();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
